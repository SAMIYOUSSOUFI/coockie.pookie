<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#fff5f7;
    color:#4a2c2a;
    overflow-x:hidden;
}

/* =========================
   HERO
========================= */

header{
    height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
    isolation:isolate;
}

header::before{
    content:"";
    position:absolute;
    inset:-8%;
    background-image:url("images/background.jpg");
    background-size:cover;
    background-position:center;
    z-index:-2;
    animation:heroZoom 18s ease-in-out infinite alternate;
}

header::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        rgba(80,35,45,.42),
        rgba(80,35,45,.55)
    );
    z-index:-1;
}

@keyframes heroZoom{

    0%{
        transform:scale(1);
    }

    100%{
        transform:scale(1.12);
    }

}

.hero{
    max-width:850px;
    animation:heroFade 1.2s ease;
}

@keyframes heroFade{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.hero h1{
    font-size:70px;
    font-weight:700;
    text-shadow:0 4px 20px rgba(0,0,0,.35);
}

.hero p{
    margin:20px 0;
    font-size:22px;
}

/* =========================
   BUTTON
========================= */

.btn{
    display:inline-block;
    padding:16px 36px;
    background:#e89aaa;
    color:white;
    text-decoration:none;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
    border:none;
    cursor:pointer;
    font-size:16px;
}

.btn:hover{
    background:#d97f91;
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(150,70,90,.25);
}

.btn:disabled{
    background:#e7c1c8;
    cursor:not-allowed;
    transform:none;
}

/* =========================
   GENERAL SECTIONS
========================= */

section{
    padding:80px 10%;
}

.title{
    text-align:center;
    font-size:42px;
    margin-bottom:15px;
    color:#4a2c2a;
}

.subtitle{
    text-align:center;
    font-size:18px;
    color:#9a7478;
    margin-bottom:50px;
}

/* =========================
   PROMO
========================= */

.promo{
    background:
    linear-gradient(
        90deg,
        rgba(232,154,170,.94),
        rgba(246,183,197,.94)
    );

    color:white;
    text-align:center;
    padding:22px 10%;
    font-size:22px;
    font-weight:600;
}

.promo span{
    display:inline-block;
    background:rgba(255,255,255,.28);
    padding:6px 16px;
    border-radius:30px;
    margin-left:10px;
    font-size:16px;
}

/* =========================
   MENU
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}

.card{
    position:relative;
    background:#ffffff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(120,60,70,.10);
    transition:.3s;
    border:1px solid #f9e1e6;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(200,110,130,.18);
}

.card img{
    width:100%;
    height:270px;
    object-fit:cover;
    display:block;
    transition:.4s;
}

.card:hover img{
    transform:scale(1.05);
}

.card h3{
    padding:15px 15px 0;
    font-size:20px;
    color:#4a2c2a;
}

.card p{
    padding:5px 15px 10px;
    color:#80686b;
    font-size:14px;
}

.price{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 15px 20px;
}

.price span{
    font-weight:700;
    color:#df8c9e;
    font-size:18px;
}

.tag{
    position:absolute;
    top:15px;
    left:15px;
    background:#e89aaa;
    color:white;
    padding:6px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    z-index:2;
}

.card.clickable{
    cursor:pointer;
}

.card.clickable:hover{
    box-shadow:0 15px 35px rgba(232,154,170,.28);
}

/* =========================
   TOPPING OPTIONS
========================= */

.kinder-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:20px 0 10px;
}

.kinder-option{
    background:#fff1f4;
    border:2px solid transparent;
    border-radius:16px;
    padding:12px 8px;
    cursor:pointer;
    transition:.2s;
    text-align:center;
}

.kinder-option:hover{
    border-color:#e89aaa;
    transform:translateY(-3px);
    background:#ffe9ee;
}

.kinder-option img{
    width:100%;
    height:80px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:8px;
    display:block;
}

.kinder-option span{
    font-size:13px;
    font-weight:700;
    color:#4a2c2a;
}

/* =========================
   GALLERY
========================= */

.gallery-section{
    background:#fffafb;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.gallery-item{
    position:relative;
    height:350px;
    overflow:hidden;
    border-radius:22px;
    box-shadow:0 8px 25px rgba(120,60,70,.10);
    background:#fcecef;
}

.gallery-item:first-child{
    grid-column:span 2;
    height:430px;
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.6s;
}

.gallery-item:hover img{
    transform:scale(1.06);
}

.gallery-caption{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:50px 20px 20px;
    color:white;
    font-size:17px;
    font-weight:600;
    background:linear-gradient(
        transparent,
        rgba(70,35,40,.72)
    );
}

/* =========================
   ABOUT
========================= */

.about{
    background:#ffe9ee;
    text-align:center;
}

.about p{
    max-width:800px;
    margin:auto;
    font-size:19px;
    line-height:1.8;
    color:#6e5054;
}

.features{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-top:40px;
}

.feature{
    background:white;
    padding:30px;
    border-radius:20px;
    font-size:18px;
    font-weight:600;
    color:#5a363b;
    box-shadow:0 5px 15px rgba(120,60,70,.08);
    transition:.3s;
}

.feature:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(200,110,130,.15);
}

/* =========================
   MODALS
========================= */

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(60,30,35,.65);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal-overlay.show{
    display:flex;
}

.modal-box{
    background:#ffffff;
    color:#4a2c2a;
    border-radius:24px;
    max-width:380px;
    width:100%;
    padding:40px 30px;
    text-align:center;
    animation:pop .35s ease;
    box-shadow:0 20px 50px rgba(70,30,40,.20);
}

@keyframes pop{

    from{
        transform:scale(.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.modal-box .emoji{
    font-size:60px;
    margin-bottom:10px;
}

.modal-box h3{
    font-size:26px;
    margin-bottom:10px;
    color:#df8c9e;
}

.modal-box p{
    font-size:16px;
    color:#80686b;
    margin-bottom:25px;
}

/* =========================
   CONTACT
========================= */

.contact{
    text-align:center;
    background:#4a2c2a;
    color:white;
}

.contact h2{
    font-size:42px;
    margin-bottom:20px;
}

.contact p{
    font-size:20px;
    margin-bottom:20px;
}

.contact h3{
    font-size:20px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:25px;
}

.buttons a{
    padding:17px 35px;
    border-radius:50px;
    color:white;
    font-weight:bold;
    text-decoration:none;
    transition:.3s;
}

.buttons a:hover{
    transform:translateY(-3px);
}

.whatsapp{
    background:#25D366;
}

.instagram{
    background:#E1306C;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#351f21;
    color:white;
    text-align:center;
    padding:25px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }

    .gallery-item:first-child{
        grid-column:span 2;
    }

}

@media(max-width:768px){

    .hero h1{
        font-size:44px;
    }

    .hero p{
        font-size:16px;
    }

    section{
        padding:60px 6%;
    }

    .title{
        font-size:30px;
    }

    .subtitle{
        font-size:15px;
    }

    .promo{
        font-size:16px;
        padding:18px 6%;
    }

    .about p{
        font-size:16px;
    }

    .contact h2{
        font-size:30px;
    }

    .contact p{
        font-size:16px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .gallery-item,
    .gallery-item:first-child{
        grid-column:span 1;
        height:350px;
    }

}

@media(max-width:480px){

    .hero h1{
        font-size:32px;
    }

    .hero p{
        font-size:14px;
    }

    .btn{
        padding:14px 28px;
        font-size:14px;
    }

    .promo{
        font-size:14px;
    }

    .promo span{
        display:block;
        width:fit-content;
        margin:10px auto 0;
    }

    .buttons{
        flex-direction:column;
        align-items:center;
    }

    .buttons a{
        width:100%;
        max-width:260px;
        text-align:center;
    }

    .kinder-options{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
